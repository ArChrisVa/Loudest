  <rect x=".5" y=".5" width="15" height="15" rx="3" fill="none" stroke="#ecebe4" stroke-opacity=".18"/>
  <circle cx="8" cy="8" r="5" fill="none" stroke="#ecebe4" stroke-width="2"/>
  <path d="M5.5 7.5 V8.5 M10.5 7.5 V8.5" fill="none" stroke="#ecebe4" stroke-width="1" stroke-linecap="round"/>
  <path d="M8 6.5 V9.5" fill="none" stroke="#e6b455" stroke-width="2" stroke-linecap="round"/>
</svg>
