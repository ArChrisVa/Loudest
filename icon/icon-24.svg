  <rect x=".5" y=".5" width="23" height="23" rx="4.75" fill="none" stroke="#ecebe4" stroke-opacity=".18"/>
  <circle cx="12" cy="12" r="7.5" fill="none" stroke="#ecebe4" stroke-width="3"/>
  <path d="M8 11.5 V12.5 M16 11.5 V12.5" fill="none" stroke="#ecebe4" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 9 V15" fill="none" stroke="#e6b455" stroke-width="2" stroke-linecap="round"/>
</svg>
