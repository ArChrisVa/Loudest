<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- A lens over a line of sound, and inside it the one loud moment, in
       amber. The app finds that moment in hours of sound. The lens is a plain
       ring with no handle: on Loudest's website it is also the cursor. One
       quiet bar either side says the sound goes on beyond the lens. The tile
       has a lighter edge so that it does not sink into a dark taskbar.
       Colours: ink #0a0b0d, bone #ecebe4, amber #e6b455, as in styles.css. -->
  <rect width="256" height="256" rx="56" fill="#0a0b0d"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ecebe4" stroke-opacity=".16" stroke-width="3"/>

  <!-- the sound outside the lens -->
  <path d="M23.5 117 V139 M232.5 117 V139" fill="none" stroke="#ecebe4" stroke-opacity=".32" stroke-width="14" stroke-linecap="round"/>

  <!-- the lens -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="#ecebe4" stroke-width="18"/>

  <!-- what it shows: two quiet bars and the loud one -->
  <path d="M96 114 V142 M160 114 V142" fill="none" stroke="#ecebe4" stroke-width="18" stroke-linecap="round"/>
  <path d="M128 85 V171" fill="none" stroke="#e6b455" stroke-width="18" stroke-linecap="round"/>
</svg>
