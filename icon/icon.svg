<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The icon is the lens itself: a thin ring out to the very edge, dark
       inside, and in it the one loud moment, in amber, between two quiet
       bars. The app finds that moment in hours of sound. There is no square
       tile behind it: on a dark taskbar a dark tile cannot be seen, and the
       ring alone then looked small beside other icons. The dark inside is
       what keeps it readable on a light background. On Loudest's website the
       lens is also the cursor.
       Colours: ink #0a0b0d, bone #ecebe4, amber #e6b455, as in styles.css. -->
  <circle cx="128" cy="128" r="128" fill="#0a0b0d"/>

  <!-- the lens -->
  <circle cx="128" cy="128" r="117" fill="none" stroke="#ecebe4" stroke-width="22"/>

  <!-- what it shows: two quiet bars and the loud one -->
  <path d="M75 115 V141 M181 115 V141" fill="none" stroke="#ecebe4" stroke-width="22" stroke-linecap="round"/>
  <path d="M128 75 V181" fill="none" stroke="#e6b455" stroke-width="22" stroke-linecap="round"/>
</svg>
